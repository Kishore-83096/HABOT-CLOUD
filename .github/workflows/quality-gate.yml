name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check app config manage.py

      - name: Check Python formatting
        run: ruff format --check app config manage.py

      - name: Run tests
        run: python -m pytest

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      - name: Scan Terraform security
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          soft_fail: false

  quarantine-on-failure:
    if: ${{ always() && needs.quality-gate.result == 'failure' }}
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Record failed build
        run: |
          mkdir -p quarantine
          printf 'Build blocked by quality-gate\nRun: %s\nCommit: %s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > quarantine/build-status.txt

      - name: Upload quarantined build evidence
        uses: actions/upload-artifact@v4
        with:
          name: quarantined-build-${{ github.run_id }}
          path: quarantine/build-status.txt
